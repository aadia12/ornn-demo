# Save as .github/workflows/ocpi_daily.yml in your repo.
# Runs after OCPI settles (4:00 PM ET) on weekdays and commits the updated CSV,
# so your history keeps growing past the free tier's 3-month window.
name: ocpi-daily-pull

on:
  schedule:
    - cron: "30 22 * * 1-5"   # 22:30 UTC = 6:30 PM EDT / 5:30 PM EST
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pandas numpy
      - run: python ocpi_pull.py --outdir data
      - name: Commit updated data
        run: |
          git config user.name "ocpi-bot"
          git config user.email "ocpi-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "OCPI pull $(date -u +%F)"
          git push
